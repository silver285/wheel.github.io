<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Name Wheel</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    background: #f4f6fb;
    color: #222;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .app {
    width: min(1100px, 96vw);
    display: grid;
    grid-template-columns: 1fr 330px;
    gap: 24px;
    background: white;
    border-radius: 22px;
    padding: 24px;
    box-shadow: 0 12px 40px rgba(0,0,0,.12);
  }
  .wheel-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 620px;
  }
  .wheel-wrap {
    position: relative;
    width: min(600px, 72vw);
    aspect-ratio: 1;
  }
  canvas {
    width: 100%;
    height: 100%;
    display: block;
    border-radius: 50%;
  }
  .pointer {
    position: absolute;
    top: -9px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 18px solid transparent;
    border-right: 18px solid transparent;
    border-top: 42px solid #222;
    z-index: 5;
    filter: drop-shadow(0 3px 2px rgba(0,0,0,.25));
  }
  .spin-btn {
    margin-top: 22px;
    border: none;
    border-radius: 999px;
    padding: 15px 42px;
    font-size: 22px;
    font-weight: 700;
    cursor: pointer;
    background: #222;
    color: white;
    transition: transform .15s, opacity .15s;
  }
  .spin-btn:hover { transform: scale(1.04); }
  .spin-btn:disabled { opacity: .5; cursor: not-allowed; }
  .result {
    min-height: 34px;
    margin-top: 12px;
    font-size: 24px;
    font-weight: 700;
    text-align: center;
  }
  .panel {
    border-radius: 16px;
    background: #f7f8fc;
    padding: 20px;
  }
  h1 {
    margin: 0 0 6px;
    font-size: 25px;
  }
  .hint {
    margin: 0 0 16px;
    color: #666;
    font-size: 14px;
    line-height: 1.4;
  }
  textarea {
    width: 100%;
    height: 280px;
    resize: vertical;
    border: 1px solid #d5d8e0;
    border-radius: 12px;
    padding: 12px;
    font-size: 15px;
    outline: none;
    background: white;
  }
  textarea:focus { border-color: #777; }
  .buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 10px;
  }
  .small-btn {
    border: 1px solid #cfd3dc;
    background: white;
    border-radius: 10px;
    padding: 10px;
    cursor: pointer;
    font-weight: 600;
  }
  .small-btn:hover { background: #eef0f5; }
  .danger { color: #b00020; }
  .count {
    margin-top: 12px;
    color: #666;
    font-size: 14px;
  }
  .remove-row {
    margin-top: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
  }
  input[type="checkbox"] { width: 17px; height: 17px; }

  @media (max-width: 800px) {
    .app { grid-template-columns: 1fr; }
    .wheel-area { min-height: auto; }
    .wheel-wrap { width: min(620px, 88vw); }
  }
</style>
</head>
<body>

<div class="app">
  <section class="wheel-area">
    <div class="wheel-wrap">
      <canvas id="wheel" width="700" height="700"></canvas>
      <div class="pointer"></div>
    </div>
    <button class="spin-btn" id="spinBtn">SPIN</button>
    <div class="result" id="result"></div>
  </section>

  <aside class="panel">
    <h1>Name Wheel</h1>
    <p class="hint">
      Enter one name per line. You can paste a whole list from Excel, Word, or Google Sheets.
    </p>

    <textarea id="names">Nguyễn An
Trần Bình
Lê Minh
Phạm Nam
Hoàng Anh
Ngọc Linh</textarea>

    <div class="buttons">
      <button class="small-btn" id="updateBtn">Update Wheel</button>
      <button class="small-btn danger" id="clearBtn">Clear</button>
    </div>

    <div class="remove-row">
      <input type="checkbox" id="removeWinner">
      <label for="removeWinner">Remove winner after spin</label>
    </div>

    <div class="count" id="count"></div>
  </aside>
</div>

<script>
const canvas = document.getElementById("wheel");
const ctx = canvas.getContext("2d");
const namesBox = document.getElementById("names");
const spinBtn = document.getElementById("spinBtn");
const updateBtn = document.getElementById("updateBtn");
const clearBtn = document.getElementById("clearBtn");
const result = document.getElementById("result");
const count = document.getElementById("count");
const removeWinner = document.getElementById("removeWinner");

let names = [];
let rotation = 0;
let spinning = false;

const colors = [
  "#FF6B6B", "#4ECDC4", "#45B7D1", "#F7B731",
  "#5F27CD", "#1DD1A1", "#FF9F43", "#54A0FF",
  "#EE5253", "#10AC84", "#A55EEA", "#2E86DE"
];

function readNames() {
  names = namesBox.value
    .split(/\r?\n/)
    .map(x => x.trim())
    .filter(Boolean);

  result.textContent = "";
  drawWheel();
  count.textContent = `${names.length} name${names.length === 1 ? "" : "s"}`;
}

function drawWheel() {
  const w = canvas.width;
  const h = canvas.height;
  const cx = w / 2;
  const cy = h / 2;
  const radius = Math.min(cx, cy) - 10;

  ctx.clearRect(0, 0, w, h);

  if (names.length === 0) {
    ctx.beginPath();
    ctx.arc(cx, cy, radius, 0, Math.PI * 2);
    ctx.fillStyle = "#e9ebf1";
    ctx.fill();
    ctx.fillStyle = "#666";
    ctx.font = "bold 30px Arial";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("Add names", cx, cy);
    return;
  }

  const slice = (Math.PI * 2) / names.length;

  for (let i = 0; i < names.length; i++) {
    const start = rotation + i * slice;
    const end = start + slice;

    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, radius, start, end);
    ctx.closePath();
    ctx.fillStyle = colors[i % colors.length];
    ctx.fill();

    ctx.strokeStyle = "rgba(255,255,255,.9)";
    ctx.lineWidth = 3;
    ctx.stroke();

    // Text
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(start + slice / 2);
    ctx.textAlign = "right";
    ctx.textBaseline = "middle";

    let fontSize = names.length > 18 ? 16 : names.length > 12 ? 18 : 22;
    ctx.font = `bold ${fontSize}px Arial`;
    ctx.fillStyle = "#111";

    let text = names[i];
    const maxWidth = radius * 0.58;

    if (ctx.measureText(text).width > maxWidth) {
      while (text.length > 1 && ctx.measureText(text + "…").width > maxWidth) {
        text = text.slice(0, -1);
      }
      text += "…";
    }

    ctx.fillText(text, radius - 20, 0);
    ctx.restore();
  }

  // Center circle
  ctx.beginPath();
  ctx.arc(cx, cy, 45, 0, Math.PI * 2);
  ctx.fillStyle = "white";
  ctx.fill();
  ctx.strokeStyle = "#222";
  ctx.lineWidth = 4;
  ctx.stroke();
}

function spin() {
  if (spinning || names.length < 2) {
    if (names.length < 2) {
      result.textContent = "Add at least 2 names.";
    }
    return;
  }

  spinning = true;
  spinBtn.disabled = true;
  result.textContent = "";

  const startRotation = rotation;
  const extraTurns = 6 + Math.random() * 3;
  const randomAngle = Math.random() * Math.PI * 2;
  const targetRotation = startRotation + extraTurns * Math.PI * 2 + randomAngle;
  const duration = 4500;
  const startTime = performance.now();

  function animate(now) {
    const elapsed = now - startTime;
    const t = Math.min(elapsed / duration, 1);

    // Ease out cubic
    const eased = 1 - Math.pow(1 - t, 3);
    rotation = startRotation + (targetRotation - startRotation) * eased;

    drawWheel();

    if (t < 1) {
      requestAnimationFrame(animate);
    } else {
      rotation = rotation % (Math.PI * 2);

      // Pointer is at the top (-PI/2).
      const slice = (Math.PI * 2) / names.length;
      const pointerAngle = -Math.PI / 2;
      let relative = (pointerAngle - rotation) % (Math.PI * 2);
      if (relative < 0) relative += Math.PI * 2;

      const winnerIndex = Math.floor(relative / slice);
      const winner = names[winnerIndex];

      result.textContent = "🎉 " + winner + " 🎉";

      if (removeWinner.checked) {
        setTimeout(() => {
          names.splice(winnerIndex, 1);
          namesBox.value = names.join("\n");
          drawWheel();
          count.textContent = `${names.length} name${names.length === 1 ? "" : "s"}`;
        }, 900);
      }

      spinning = false;
      spinBtn.disabled = false;
    }
  }

  requestAnimationFrame(animate);
}

updateBtn.addEventListener("click", readNames);

clearBtn.addEventListener("click", () => {
  namesBox.value = "";
  readNames();
});

spinBtn.addEventListener("click", spin);

namesBox.addEventListener("input", () => {
  // Update automatically after editing, but do not interrupt a spin.
  if (!spinning) readNames();
});

readNames();
</script>
</body>
</html>
